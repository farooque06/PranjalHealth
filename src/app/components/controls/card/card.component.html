<div class="card-section">
  <div class="card">
    <div class="image-container">
      <img [src]="src" class="card-img-top" alt="...">
    </div>
    <div *ngIf="showBody" class="card-body">
      <h5 class="card-title">{{title}}</h5>
      <p  class="card-text">{{content}}</p>
    </div>
  </div>
</div>
