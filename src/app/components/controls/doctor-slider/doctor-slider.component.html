<div class="slider-container">
    <ngx-slick-carousel class="carousel"
        #slickModal="slick-carousel"
        [config]="slideConfig"
        (breakpoint)="breakpoint($event)"
      >
        <div ngxSlickItem *ngFor="let slide of slides; let i=index;" (click)="showDetails(slide.index !== undefined ? slide.index : i)" class="slide">
            <!-- <img src="{{ slide.img }}" alt="" width="100%" height="100%"> -->
            <!-- <div class="card">
                <img src="{{ slide.img }}" alt="" width="100%" height="100%">
                <div class="card-body">
                    <h5 class="card-title">{{slide.title}}</h5>
                    <p class="card-text">{{slide.subTitle}}</p>
                </div>
            </div> -->

            <app-card 
              [title]="slide.title" 
              [titleNepali]="slide.titleNepali"
              [src]="slide.img" 
              [content]="slide.subTitle" 
              [contentNepali]="slide.subTitleNepali"
              [department]="slide.department"
              [departmentNepali]="slide.departmentNepali">
            </app-card>

        </div>
    </ngx-slick-carousel>

</div>
